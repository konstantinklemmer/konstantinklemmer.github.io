items:

  - date: "04/08/2026"
    text: >-
      Our <a href="https://ieeexplore.ieee.org/document/11636001">perspective paper on Earth embeddings</a> has been published in IEEE GRSM and is fully open-access.

  - date: "05/07/2026"
    text: >-
      We gave a <a href="https://github.com/konstantinklemmer/isprs26-embeddings-tutorial">tutorial</a> on Earth embeddings at the ISPRS Congress 2026. Check out the materials on Github!

  - date: "01/06/2026"
    text: >-
      New <a href="https://arxiv.org/abs/2606.02374">preprint</a> out on unifying raster data and vector semantics for human-centric geospatial foundation models.

  - date: "13/05/2026"
    text: >-
      New <a href="https://eartharxiv.org/repository/view/13019/">perspectives paper</a> out presenting a blueprint for Integrated Climate Intelligence.

  - date: "01/05/2026"
    text: >-
      One <a href="https://arxiv.org/abs/2602.00392">paper</a> accepted at ICML 2026.

  - date: "21/04/2026"
    text: >-
      New <a href="https://arxiv.org/abs/2604.16220">preprint</a> on predicting geographic distribution shifts with Earth embeddings.

  - date: "10/04/2026"
    text: >-
      New <a href="https://arxiv.org/abs/2603.29441">workshop paper</a> at ICLR 2026.

  - date: "07/02/2026"
    text: >-
      New <a href="https://arxiv.org/abs/2602.00392">preprint</a> out on high-resolution, regional location encoding.

  - date: "30/01/2026"
    text: >-
      One <a href="https://arxiv.org/abs/2511.02101">paper</a> accepted at ICLR 2026.

  - date: "10/12/2025"
    text: >-
      New <a href="https://eartharxiv.org/repository/view/11083/">perspectives paper</a> out defining Earth embedding research and community priorities.

  - date: "09/11/2025"
    text: >-
      New <a href="https://arxiv.org/abs/2511.02101">preprint</a> out on the intrinsic dimensions of Earth embeddings.

  - date: "08/08/2025"
    text: >-
      I have joined <a href="https://lgnd.io/">LGND AI</a> as principal AI research engineer.

  - date: "29/04/2025"
    text: >-
      We presented two papers [<a href="https://www.climatechange.ai/papers/iclr2025/20">1</a>,<a href="https://www.climatechange.ai/papers/iclr2025/25">2</a>] at the ICLR 2025 workshops on "Tackling Climate Change with Machine Learning", "ML for Remote Sensing" and "ML for Multiscale Processes".

  - date: "18/12/2024"
    text: >-
      I have transitioned into a full-time researcher role at Microsoft Research.

  - date: "10/12/2024"
    text: >-
      One <a href="https://arxiv.org/abs/2311.17179">paper</a> accepted at AAAI.

  - date: "18/11/2024"
    text: >-
      I will be joining <a href="https://www.ucl.ac.uk/">UCL</a> as an Assistant Professor in Geospatial AI from fall 2026. I am currently recruiting PhD students (see above).

  - date: "04/05/2024"
    text: >-
      One <a href="https://arxiv.org/abs/2402.01444">paper</a> accepted at ICML.

  - date: "21/02/2024"
    text: >-
      I recently talked about SatCLIP on Robin Cole's "Satellite Image Deep Learning" podcast. You can check the recording <a href="https://www.satellite-image-deep-learning.com/p/location-embedding-with-satclip-with">here</a>.

  - date: "16/01/2024"
    text: >-
      One <a href="https://arxiv.org/abs/2310.06743">paper</a> accepted at ICLR as a spotlight.

  - date: "04/01/2024"
    text: >-
      New <a href="https://www.nature.com/articles/d41586-023-03983-7">short paper</a> out in Nature, commenting on recent advances in ocean activity mapping using satellite imagery and deep learning.

  - date: "03/12/2023"
    text: >-
      I will be attending AGU and NeurIPS in the coming week. Drop me a message if you want to meet up and chat!

  - date: "01/12/2023"
    text: >-
      New <a href="https://arxiv.org/abs/2311.17179">preprint</a> out on global, general-purpose pretrained location encoders with satellite imagery.

  - date: "11/10/2023"
    text: >-
      New <a href="https://arxiv.org/abs/2310.06743">preprint</a> out on geographic location encoding with neural networks.

  - date: "22/07/2023"
    text: >-
      I gave a lecture on <a href="https://www.youtube.com/watch?v=pOYEo2Gtw-c">AI for Transportation</a> at the virtual <a href="https://www.climatechange.ai">Climate Change AI</a> Summer School 2023.

  - date: "21/07/2023"
    text: >-
      I recently gave talks at MIT and NYU.

  - date: "27/01/2023"
    text: >-
      I recently gave talks at Harvard, USC, TU Berlin and the National Renewable Energy Laboratory (NREL).

  - date: "20/01/2023"
    text: >-
      One <a href="https://arxiv.org/abs/2111.10144">paper</a> accepted at AISTATS 2023.
